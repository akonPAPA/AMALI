[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amali-core"
version = "0.0.1"
description = "AMALI Investor Gate Alpha local kernel: owner-governed, evidence-first, auditable AI infrastructure."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Local, full-control model runtime (owner choice: no hosted providers).
local_llm = [
    "torch>=2.2",
    "transformers>=4.40",
    "accelerate>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
